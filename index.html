<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Consistency"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Consistency</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#20232a;--line:#2b2e36;--muted:#9298a5;--text:#f4f5f7;--green:#35c987;--yellow:#e8b84d;--red:#ed6666;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:680px;margin-inline:auto}button,input{font:inherit}button{cursor:pointer;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 22px}.brand{font-weight:750;letter-spacing:-.5px;font-size:19px}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}.hero{margin-bottom:22px}.hero h1{font-size:30px;letter-spacing:-1.1px;margin:7px 0 5px}.sub{color:var(--muted);margin:0}.section{margin:24px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:16px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 12px;font-size:13px}.btn.primary{background:var(--text);color:#111;border-color:var(--text);font-weight:650}.btn.ghost{background:transparent}.monthbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}.monthbar strong{font-size:16px}.arrows{display:flex;gap:7px}.arrow{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:18px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;color:var(--muted);font-size:11px;padding-bottom:4px}.day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;position:relative;font-size:13px;color:#c6cad2}.day.empty{visibility:hidden}.day.today{outline:1px solid #777d8a;outline-offset:1px}.day.selected{border:2px solid var(--accent);color:white}.day.green{background:rgba(53,201,135,.2);border-color:rgba(53,201,135,.48)}.day.yellow{background:rgba(232,184,77,.19);border-color:rgba(232,184,77,.48)}.day.red{background:rgba(237,102,102,.17);border-color:rgba(237,102,102,.42)}.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.date-title{font-weight:650}.muted{color:var(--muted)}.habit{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.habit:last-child{border-bottom:0;padding-bottom:0}.habit:first-child{padding-top:0}.habit-info{flex:1;min-width:0}.habit-name{font-weight:600}.habit-meta{font-size:11px;color:var(--muted);margin-top:4px}.states{display:flex;gap:5px}.state{width:31px;height:31px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;font-size:12px;color:var(--muted)}.state.active.done{background:rgba(53,201,135,.2);border-color:var(--green);color:var(--green)}.state.active.partial{background:rgba(232,184,77,.2);border-color:var(--yellow);color:var(--yellow)}.state.active.missed{background:rgba(237,102,102,.17);border-color:var(--red);color:var(--red)}.goal-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.goal-row:last-child{border:0}.goal-icon{width:37px;height:37px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:17px}.goal-row .info{flex:1}.goal-row strong{font-size:14px}.progress{height:5px;background:#30333b;border-radius:9px;margin-top:7px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:9px}.small{font-size:11px;color:var(--muted)}.empty-state{text-align:center;padding:24px 12px;color:var(--muted)}.empty-state strong{display:block;color:var(--text);margin-bottom:6px}.footer{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 10px}.modal-backdrop{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal-backdrop.show{display:flex}.modal{width:100%;max-width:520px;background:#1b1d23;border:1px solid var(--line);border-radius:20px;padding:20px;max-height:90dvh;overflow:auto}.modal h3{margin:0 0 17px;font-size:19px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);outline:none}.field input:focus{border-color:var(--accent)}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions button{flex:1}.checkline{display:flex;gap:9px;align-items:center;color:#d4d7de;font-size:13px;margin-top:12px}.checkline input{accent-color:var(--accent)}.hidden{display:none!important}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#292c34;padding:10px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(min-width:600px){body{padding-top:28px}.modal-backdrop{align-items:center}}
</style></head>
<body>
<header class="top"><div class="brand">◉ consistency</div><button class="btn ghost" id="addTop">＋ Add goal</button></header>
<main><div class="hero"><div class="eyebrow">Small steps. Real progress.</div><h1>Your consistency, over time.</h1><p class="sub">No streaks. Just showing up more often.</p></div>
<section class="section"><div class="monthbar"><strong id="monthLabel"></strong><div class="arrows"><button class="arrow" id="prev" aria-label="Previous month">‹</button><button class="arrow" id="next" aria-label="Next month">›</button></div></div><div class="calendar" id="calendar"></div><div class="legend"><span><i class="dot red"></i>Little or nothing</span><span><i class="dot yellow"></i>Some progress</span><span><i class="dot green"></i>Everything done</span></div></section>
<section class="section"><div class="section-head"><h2 id="checkTitle">Today</h2><span class="small" id="daySummary"></span></div><div class="card" id="checkin"></div></section>
<section class="section"><div class="section-head"><h2>Your goals</h2><button class="btn" id="addGoal">＋ Add</button></div><div class="card" id="goals"></div></section>
<div class="footer"><button class="btn ghost" id="exportBtn">Export backup</button><button class="btn ghost" id="importBtn">Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>
<p class="small">Your information is saved on this device only. Export a backup occasionally to keep your data safe.</p></main>
<div class="modal-backdrop" id="modal"><div class="modal"><h3 id="modalTitle">Add a goal</h3><label class="field"><span>Goal name</span><input id="goalName" maxlength="40" placeholder="e.g. Go to the gym"></label><label class="field"><span>Emoji (optional)</span><input id="goalEmoji" maxlength="4" placeholder="🏋️"></label><label class="checkline"><input type="checkbox" id="weeklyEnabled"> Set a weekly target</label><label class="field hidden" id="weeklyField"><span>Days per week</span><input type="number" id="weeklyTarget" min="1" max="7" value="3"></label><div class="modal-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveGoal">Save goal</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const KEY='consistency-tracker-v1';let data=load();let view=new Date();view.setDate(1);let selected=iso(new Date());let editing=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{goals:[],logs:{}}}catch{return{goals:[],logs:{}}}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parse(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function labelDate(s){return parse(s).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}function dayStatus(key){if(!data.goals.length)return '';let states=data.goals.map(g=>data.logs[key]?.[g.id]||'');if(!states.some(Boolean))return '';let done=states.filter(s=>s==='done').length;let partial=states.filter(s=>s==='partial').length;let scored=done+partial*.5;let ratio=scored/states.length;if(ratio===1)return 'green';if(ratio>=.5)return 'yellow';return 'red'}function dayCounts(key){let vals=data.goals.map(g=>data.logs[key]?.[g.id]||'');return{done:vals.filter(x=>x==='done').length,partial:vals.filter(x=>x==='partial').length,total:vals.length}}
function renderCalendar(){let y=view.getFullYear(),m=view.getMonth();$('monthLabel').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});let first=new Date(y,m,1).getDay();first=(first+6)%7;let days=new Date(y,m+1,0).getDate();let html=['M','T','W','T','F','S','S'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let key=iso(new Date(y,m,d)),status=dayStatus(key),cls=['day',status,key===iso(new Date())?'today':'',key===selected?'selected':''].filter(Boolean).join(' ');html+=`<button class="${cls}" data-day="${key}">${d}</button>`}$('calendar').innerHTML=html;$('calendar').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;render()})}
function renderCheckin(){let counts=dayCounts(selected);$('checkTitle').textContent=selected===iso(new Date())?'Today':labelDate(selected);$('daySummary').textContent=counts.total?`${counts.done}/${counts.total} done`:'';if(!data.goals.length){$('checkin').innerHTML='<div class="empty-state"><strong>Start with one small goal.</strong>Add a goal and check in here each day.</div>';return}let html='';for(let g of data.goals){let val=data.logs[selected]?.[g.id]||'';html+=`<div class="habit"><div class="habit-info"><div class="habit-name">${esc(g.emoji||'○')} ${esc(g.name)}</div><div class="habit-meta">${g.weekly?`Target: ${g.weekly} days this week`:'Daily goal'}</div></div><div class="states"><button class="state ${val==='done'?'active done':''}" data-id="${g.id}" data-state="done" aria-label="Completed">✓</button><button class="state ${val==='partial'?'active partial':''}" data-id="${g.id}" data-state="partial" aria-label="Partially completed">½</button><button class="state ${val==='missed'?'active missed':''}" data-id="${g.id}" data-state="missed" aria-label="Not completed">×</button></div></div>`}$('checkin').innerHTML=html;$('checkin').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let id=b.dataset.id,state=b.dataset.state;data.logs[selected]??={};data.logs[selected][id]=data.logs[selected][id]===state?'':state;if(!data.logs[selected][id])delete data.logs[selected][id];if(!Object.keys(data.logs[selected]).length)delete data.logs[selected];save();render()})}
function weekStart(date){let d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}function weeklyDone(g){let start=weekStart(new Date());let n=0;for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);if(data.logs[iso(d)]?.[g.id]==='done')n++}return n}
function renderGoals(){if(!data.goals.length){$('goals').innerHTML='<div class="empty-state"><strong>No goals yet</strong>Keep it simple. Start with one thing you want to do more consistently.</div>';return}let html='';for(let g of data.goals){let start=new Date();start.setDate(start.getDate()-44);let count=0;for(let i=0;i<45;i++){let d=new Date(start);d.setDate(d.getDate()+i);if(data.logs[iso(d)]?.[g.id]==='done')count++}let weekly=g.weekly?weeklyDone(g):null;html+=`<div class="goal-row"><div class="goal-icon">${esc(g.emoji||'○')}</div><div class="info"><strong>${esc(g.name)}</strong><div class="small">${count}/45 days${g.weekly?` · This week ${weekly}/${g.weekly}`:''}</div><div class="progress"><span style="width:${count/45*100}%"></span></div></div><button class="btn ghost edit" data-edit="${g.id}">•••</button></div>`}$('goals').innerHTML=html}
function render(){renderCalendar();renderCheckin();renderGoals()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(id=null){editing=id;let g=data.goals.find(x=>x.id===id);$('modalTitle').textContent=g?'Edit goal':'Add a goal';$('goalName').value=g?.name||'';$('goalEmoji').value=g?.emoji||'';$('weeklyEnabled').checked=!!g?.weekly;$('weeklyTarget').value=g?.weekly||3;$('weeklyField').classList.toggle('hidden',!g?.weekly);$('modal').classList.add('show');$('goalName').focus()}function closeModal(){$('modal').classList.remove('show')}
$('weeklyEnabled').onchange=()=> $('weeklyField').classList.toggle('hidden',!$('weeklyEnabled').checked);$('addTop').onclick=$('addGoal').onclick=()=>openModal();$('cancelModal').onclick=closeModal;$('saveGoal').onclick=()=>{let name=$('goalName').value.trim();if(!name){$('goalName').focus();return}let weekly=$('weeklyEnabled').checked?Math.max(1,Math.min(7,Number($('weeklyTarget').value)||3)):null;if(editing){let g=data.goals.find(x=>x.id===editing);g.name=name;g.emoji=$('goalEmoji').value.trim();g.weekly=weekly}else data.goals.push({id:crypto.randomUUID(),name,emoji:$('goalEmoji').value.trim(),weekly});save();closeModal();render()};$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar()};$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='consistency-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.goals)||typeof obj.logs!=='object')throw Error();data=obj;save();render();toast('Backup restored')}catch{toast('That backup file could not be read')}e.target.value=''};
$('goals').addEventListener('contextmenu',e=>{let b=e.target.closest('[data-edit]');if(b){e.preventDefault();let id=b.dataset.edit;if(confirm('Delete this goal and its history?')){data.goals=data.goals.filter(g=>g.id!==id);for(let k of Object.keys(data.logs)){delete data.logs[k][id];if(!Object.keys(data.logs[k]).length)delete data.logs[k]}save();render()}}});$('goals').addEventListener('click',e=>{let b=e.target.closest('[data-edit]');if(!b)return;let id=b.dataset.edit;let g=data.goals.find(x=>x.id===id);let action=prompt(`Edit ${g.name}\nType DELETE to remove it, or press Cancel to edit it.`);if(action==='DELETE'){data.goals=data.goals.filter(x=>x.id!==id);for(let k of Object.keys(data.logs)){delete data.logs[k][id];if(!Object.keys(data.logs[k]).length)delete data.logs[k]}save();render()}else if(action!==null)openModal(id)});
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
